name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "docs/**"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "docs/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        java-version: ["17", "21"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run tests
        run: mvn -B verify

      - name: Package JAR
        run: mvn -B package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.java-version }}
          path: target/*.jar

      - name: Send webhook on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" \
             -d '{"content": "❌ Build failed in CI for Java version '${{ matrix.java-version }}'!"}' \
             $WEBHOOK_URL
